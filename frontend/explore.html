<script>
        const BASE_URL = window.location.origin;
        const grid = document.getElementById('course-discovery-grid');
        const searchInput = document.getElementById('search-input');

        // Micro-interactions for chips
        const chipButtons = document.querySelectorAll('section.scrollbar-hide button');
        chipButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const categoryText = btn.innerText.trim();
                if (categoryText === "Trending") {
                    loadPopular();
                } else {
                    loadPopular(categoryText);
                }
                
                // Active style toggle (only for chips)
                chipButtons.forEach(b => {
                    b.className = "px-5 py-2 rounded-full bg-surface-container-highest border border-white/10 text-on-surface-variant font-label-sm text-label-sm whitespace-nowrap hover:border-tertiary transition-colors";
                });
                btn.className = "px-5 py-2 rounded-full bg-primary text-on-primary font-label-sm text-label-sm whitespace-nowrap shadow-[0_0_10px_rgba(236,177,255,0.5)]";
            });
        });

        async function loadPopular(category = null) {
            try {
                let url = `${BASE_URL}/api/v1/popular?top_n=6`;
                if (category) {
                    url += `&category=${encodeURIComponent(category)}`;
                }
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    renderCourses(data.courses);
                }
            } catch (err) {
                console.error("Error loading popular courses:", err);
            }
        }

        async function performSearch(query) {
            if (!query.trim()) {
                loadPopular();
                return;
            }
            try {
                const res = await fetch(`${BASE_URL}/api/v1/recommend?course_title=${encodeURIComponent(query)}&top_n=6`);
                if (res.ok) {
                    const data = await res.json();
                    renderCourses(data.recommendations, true);
                } else if (res.status === 404) {
                    grid.innerHTML = `
                        <div class="col-span-1 md:col-span-2 glass-card rounded-xl p-glass-padding text-center space-y-4 inner-stroke">
                            <span class="material-symbols-outlined text-error text-5xl">warning</span>
                            <h3 class="font-headline-md text-headline-md text-on-surface">Neural Node Not Found</h3>
                            <p class="text-on-surface-variant font-body-md">The core database could not locate recommendations for "${query}".</p>
                            <p class="text-primary font-label-sm text-label-sm">TRY SEARCHING FOR: "Neural Architecture", "Quantum", OR "Deep Learning".</p>
                        </div>
                    `;
                }
            } catch (err) {
                console.error("Error searching courses:", err);
            }
        }

        function renderCourses(courses, isRecommendation = false) {
            if (!courses || courses.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-outline-variant py-8">No neural pathways active.</p>`;
                return;
            }
            
            grid.innerHTML = courses.map((course, idx) => {
                const isFeatured = idx === 0 && !isRecommendation;
                if (isFeatured) {
                    return `
                        <article onclick="window.location.href='details.html?title=' + encodeURIComponent('${course.Title}')" class="glass-card rounded-xl overflow-hidden group col-span-1 md:col-span-2 relative cursor-pointer">
                            <div class="h-64 md:h-80 w-full relative">
                                <img class="w-full h-full object-cover" src="${course.Image_URL}" alt="${course.Title}"/>
                                <div class="absolute inset-0 bg-gradient-to-t from-surface-dim via-surface-dim/40 to-transparent"></div>
                                <div class="absolute top-4 left-4 flex gap-2">
                                    <span class="px-3 py-1 rounded-lg bg-tertiary/20 backdrop-blur-md border border-tertiary/40 text-tertiary font-label-xs text-label-xs">${course.Difficulty}</span>
                                    <span class="px-3 py-1 rounded-lg bg-surface-dim/80 backdrop-blur-md border border-white/10 text-on-surface font-label-xs text-label-xs">${course.Duration.toUpperCase()}</span>
                                </div>
                            </div>
                            <div class="p-glass-padding space-y-2">
                                <h2 class="font-headline-md text-headline-md text-on-surface group-hover:text-primary transition-colors">${course.Title}</h2>
                                <p class="text-on-surface-variant font-body-md text-body-md line-clamp-2">${course.Description}</p>
                                <div class="pt-4 flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="material-symbols-outlined text-tertiary text-sm">groups</span>
                                        <span class="text-label-sm font-label-sm text-outline">${(course.Enrollment_Count/1000).toFixed(1)}k Students</span>
                                    </div>
                                    <button class="px-6 py-2 bg-primary rounded-lg text-on-primary font-label-sm text-label-sm font-bold shadow-[0_0_15px_rgba(236,177,255,0.4)] active:scale-95 transition-all">
                                        Initialize Learning
                                    </button>
                                </div>
                            </div>
                            <div class="absolute bottom-0 left-0 h-1 bg-primary w-2/3 shadow-[0_0_8px_rgba(236,177,255,1)]"></div>
                        </article>
                    `;
                } else {
                    const matchBadge = course.match_percentage !== undefined && course.match_percentage !== null
                        ? `<span class="px-2 py-1 rounded-md bg-primary/20 border border-primary/40 text-primary font-label-xs text-label-xs glow-violet">MATCH ${course.match_percentage}%</span>`
                        : `<span class="px-2 py-1 rounded-md bg-secondary-container/80 backdrop-blur-sm text-on-secondary-container font-label-xs text-label-xs">${course.Difficulty}</span>`;

                    return `
                        <article onclick="window.location.href='details.html?title=' + encodeURIComponent('${course.Title}')" class="glass-card rounded-xl overflow-hidden group cursor-pointer">
                            <div class="h-48 relative">
                                <img class="w-full h-full object-cover" src="${course.Image_URL}" alt="${course.Title}"/>
                                <div class="absolute inset-0 bg-gradient-to-t from-surface-dim/80 to-transparent"></div>
                                <div class="absolute bottom-3 left-3">
                                    ${matchBadge}
                                </div>
                            </div>
                            <div class="p-stack-md space-y-stack-sm">
                                <h3 class="font-headline-md text-[20px] text-on-surface group-hover:text-tertiary transition-colors line-clamp-1">${course.Title}</h3>
                                <div class="flex items-center justify-between text-outline">
                                    <span class="text-label-sm font-label-sm">${course.Duration}</span>
                                    <div class="flex items-center gap-1">
                                        <span class="material-symbols-outlined text-[16px] text-yellow-400" style="font-variation-settings: 'FILL' 1;">star</span>
                                        <span class="text-label-sm font-label-sm">${course.Avg_Rating}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="h-1 bg-tertiary/30 w-full group-hover:bg-tertiary transition-colors"></div>
                        </article>
                    `;
                }
            }).join('');
            
            // Re-apply hover animations/scroll reveal if needed
            setupScrollReveal();
        }

        function setupScrollReveal() {
            const observerOptions = { threshold: 0.1 };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = "1";
                        entry.target.style.transform = "translateY(0)";
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.glass-card').forEach(card => {
                card.style.opacity = "0";
                card.style.transform = "translateY(20px)";
                card.style.transition = "all 0.6s cubic-bezier(0.22, 1, 0.36, 1)";
                observer.observe(card);
            });
        }

        // Event listener for search input
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                performSearch(searchInput.value);
            }
        });

        // Load popular courses initially on page load
        window.addEventListener('DOMContentLoaded', () => loadPopular());

        // Floating particles
        const canvas = document.createElement('canvas');
        canvas.className = 'fixed inset-0 -z-30 pointer-events-none';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.speedY = Math.random() * 0.2 - 0.1;
                this.opacity = Math.random() * 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(236, 177, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        function init() {
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', resize);
        resize();
        init();
        animate();
    </script>
